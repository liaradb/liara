# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LiaraDB

on:
  push:
    branches:
      - "main"
    paths:
      - .github/workflows/liaradb.yml
      - modules/eventsource_go/**
      - services/liaradb/**
  pull_request:
    branches:
      - "main"
    paths:
      - .github/workflows/liaradb.yml
      - modules/eventsource_go/**
      - services/liaradb/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/liaradb/go.mod
          cache-dependency-path: services/liaradb/go.mod

      - name: Build
        working-directory: ./services/liaradb
        run: make build

      - name: Test
        working-directory: ./services/liaradb
        run: make test

      - name: Test Report
        working-directory: ./services/liaradb
        run: make report-file

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./services/liaradb/cover.html
          retention-days: 5

      - name: Upload binary - AMD64
        uses: actions/upload-artifact@v7
        with:
          name: liaradb-amd64
          path: ./services/liaradb/bin/liaradb-amd64
          retention-days: 5

      - name: Upload binary - ARM64
        uses: actions/upload-artifact@v7
        with:
          name: liaradb-arm64
          path: ./services/liaradb/bin/liaradb-arm64
          retention-days: 5
