# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LiaraDB

on:
  push:
    branches:
      - "main"
    paths:
      - .github/workflows/liaradb.yml
      - modules/eventsource_go/**
      - services/liaradb/**
  pull_request:
    branches:
      - "main"
    paths:
      - .github/workflows/liaradb.yml
      - modules/eventsource_go/**
      - services/liaradb/**

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/liaradb/go.mod
          cache-dependency-path: services/liaradb/go.mod

      - name: Build
        working-directory: ./services/liaradb
        run: make build

      - name: Test
        working-directory: ./services/liaradb
        run: make test

      - name: Test Report
        working-directory: ./services/liaradb
        run: make report-file

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./services/liaradb/cover.html
          retention-days: 5

      - name: Upload binary - AMD64
        uses: actions/upload-artifact@v7
        with:
          name: liaradb-amd64
          path: ./services/liaradb/bin/liaradb-amd64
          retention-days: 5

      - name: Upload binary - ARM64
        uses: actions/upload-artifact@v7
        with:
          name: liaradb-arm64
          path: ./services/liaradb/bin/liaradb-arm64
          retention-days: 5

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v4.1.0

      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./services/liaradb
          file: ./services/liaradb/Dockerfile.basic
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
